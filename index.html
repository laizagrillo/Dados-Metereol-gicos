<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoramento Meteorológico Colaborativo</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --input-bg: rgba(15, 23, 42, 0.6);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --temp-warm: #fb923c;
      --temp-cool: #38bdf8;
      --success: #4ade80;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
      max-width: 650px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.025em;
    }

    header p {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .form-section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 1.5rem;
      width: 100%;
      max-width: 1100px;
      margin-bottom: 2.5rem;
    }

    .form-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .form-header h2 {
      font-size: 1.15rem;
      font-weight: 600;
    }

    .form-links {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .btn-outline {
      background: transparent;
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }

    .btn-outline:hover {
      background: rgba(56, 189, 248, 0.1);
    }

    .location-form {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 1rem;
      align-items: end;
    }

    @media (max-width: 820px) {
      .location-form {
        grid-template-columns: 1fr 1fr;
      }
      .location-form .input-group:first-child,
      .location-form button[type="submit"] {
        grid-column: span 2;
      }
    }

    @media (max-width: 480px) {
      .location-form {
        grid-template-columns: 1fr;
      }
      .location-form .input-group:first-child,
      .location-form button[type="submit"] {
        grid-column: span 1;
      }
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .input-group label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .input-group input {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text-primary);
      padding: 0.65rem 0.9rem;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: var(--accent);
    }

    button.btn-primary {
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      padding: 0.68rem 1.3rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    button.btn-primary:hover {
      background-color: var(--accent-hover);
    }

    button.btn-primary:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .form-feedback {
      margin-top: 0.85rem;
      font-size: 0.88rem;
      display: none;
    }

    .controls {
      width: 100%;
      max-width: 1100px;
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .controls-right {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .status {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      width: 100%;
      max-width: 1100px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(56, 189, 248, 0.4);
    }

    .card-header {
      margin-bottom: 1.25rem;
    }

    .location-name {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      word-break: break-word;
    }

    .coordinates {
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-family: monospace;
    }

    .temp-display {
      display: flex;
      align-items: baseline;
      gap: 0.25rem;
      margin-top: auto;
    }

    .temp-value {
      font-size: 3rem;
      font-weight: 700;
      line-height: 1;
    }

    .temp-unit {
      font-size: 1.25rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .warm { color: var(--temp-warm); }
    .cool { color: var(--temp-cool); }

    .loader {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      width: 22px;
      height: 22px;
      animation: spin 1s linear infinite;
      display: none;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error-msg {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 1rem;
      border-radius: 12px;
      text-align: center;
      width: 100%;
      max-width: 1100px;
      margin-bottom: 1.5rem;
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Monitoramento Meteorológico</h1>
    <p>Cadastre um novo local abaixo para consultar e registrar a temperatura em tempo real</p>
  </header>

  <!-- Iframe oculto que recebe o envio nativo do Google Forms sem recarregar a página -->
  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="aoConcluirEnvioIframe()"></iframe>

  <!-- Formulário conectado diretamente ao endpoint formResponse via POST nativo -->
  <section class="form-section">
    <div class="form-header">
      <h2>Adicionar Novo Local</h2>
      <div class="form-links">
        <button type="button" class="btn-outline" onclick="usarMinhaLocalizacao()">📍 Usar meu GPS</button>
        <a class="btn-outline" href="https://docs.google.com/forms/d/e/1FAIpQLSdET-U7VZb4aG2dRaFj71POvoi6Hw2CHL5FZkZeWQdSBDTkFA/viewform?usp=sharing&ouid=102341600086617251790" target="_blank" rel="noopener">Abrir no Google Forms ↗</a>
      </div>
    </div>

    <form 
      class="location-form" 
      id="cadastroForm" 
      action="https://docs.google.com/forms/d/e/1FAIpQLSdET-U7VZb4aG2dRaFj71POvoi6Hw2CHL5FZkZeWQdSBDTkFA/formResponse" 
      method="POST" 
      target="hidden_iframe"
      onsubmit="return prepararEnvio(event)"
    >
      <div class="input-group">
        <label for="nomeLocal">Nome do local</label>
        <input type="text" id="nomeLocal" name="entry.1437313373" placeholder="Ex: Campinas - SP" required>
      </div>

      <div class="input-group">
        <label for="latitude">Latitude</label>
        <input type="text" id="latitude" name="entry.1779396836" placeholder="Ex: -22.9099" required>
      </div>

      <div class="input-group">
        <label for="longitude">Longitude</label>
        <input type="text" id="longitude" name="entry.1985115626" placeholder="Ex: -47.0626" required>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">Adicionar & Consultar</button>
    </form>

    <div class="form-feedback" id="formFeedback"></div>
  </section>

  <!-- Controles e Lista de Resultados -->
  <div class="controls">
    <h3>Locais Monitorados</h3>
    <div class="controls-right">
      <div class="loader" id="loader"></div>
      <span class="status" id="statusText"></span>
      <button type="button" class="btn-outline" id="refreshBtn" onclick="carregarDados()">↻ Atualizar Lista</button>
    </div>
  </div>

  <div class="error-msg" id="errorBox"></div>
  <main class="grid-container" id="cardsContainer"></main>

  <script>
    const ENDPOINT_PLANILHA = "https://docs.google.com/spreadsheets/d/1vW4hmVmkvqXEQFC14FMRw_rmg8EUFvf4e-IxR0ZJ0oM/gviz/tq?tqx=out:csv";
    const ENDPOINT_API = "https://api.open-meteo.com/v1/forecast";

    let envioEmAndamento = false;
    let ultimoLocalEnviado = null;

    function usarMinhaLocalizacao() {
      if (!navigator.geolocation) {
        mostrarFeedback("Seu navegador não suporta geolocalização.", "#fca5a5");
        return;
      }

      mostrarFeedback("Obtendo coordenadas...", "#38bdf8");
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          document.getElementById('latitude').value = pos.coords.latitude.toFixed(4);
          document.getElementById('longitude').value = pos.coords.longitude.toFixed(4);
          mostrarFeedback("Coordenadas preenchidas! Digite o nome do local e clique em Adicionar.", "#4ade80");
        },
        () => {
          mostrarFeedback("Não foi possível acessar sua localização. Verifique as permissões.", "#fca5a5");
        }
      );
    }

    function mostrarFeedback(mensagem, cor) {
      const feedback = document.getElementById('formFeedback');
      feedback.textContent = mensagem;
      feedback.style.color = cor;
      feedback.style.display = 'block';
    }

    // Valida os campos e libera o submit nativo do navegador para o iframe oculto
    function prepararEnvio(event) {
      const nome = document.getElementById('nomeLocal').value.trim();
      const latInput = document.getElementById('latitude');
      const lonInput = document.getElementById('longitude');

      // Normaliza vírgula para ponto antes de enviar ao Google Forms
      const latRaw = latInput.value.trim().replace(',', '.');
      const lonRaw = lonInput.value.trim().replace(',', '.');

      const lat = parseFloat(latRaw);
      const lon = parseFloat(lonRaw);

      if (isNaN(lat) || isNaN(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) {
        event.preventDefault();
        mostrarFeedback("Por favor, insira valores numéricos válidos para Latitude (-90 a 90) e Longitude (-180 a 180).", "#fca5a5");
        return false;
      }

      latInput.value = latRaw;
      lonInput.value = lonRaw;

      envioEmAndamento = true;
      ultimoLocalEnviado = { nome, lat, lon };

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = "Registrando...";
      mostrarFeedback("Enviando para o Google Forms...", "#38bdf8");

      return true; // Permite que o navegador envie o formulário nativamente para o hidden_iframe
    }

    // Disparado automaticamente assim que o Google Forms responde dentro do iframe oculto
    async function aoConcluirEnvioIframe() {
      if (!envioEmAndamento || !ultimoLocalEnviado) return;
      envioEmAndamento = false;

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = false;
      submitBtn.textContent = "Adicionar & Consultar";

      try {
        // Mostra o card imediatamente na tela consultando a Open-Meteo
        const novoLocalComClima = await buscarTemperatura(ultimoLocalEnviado);
        const container = document.getElementById('cardsContainer');
        container.prepend(criarCard(novoLocalComClima));

        mostrarFeedback(`"${ultimoLocalEnviado.nome}" registrado na planilha com sucesso!`, "#4ade80");
        document.getElementById('cadastroForm').reset();

        // Sincroniza a lista completa com a planilha após 2.5 segundos
        setTimeout(() => {
          carregarDados();
        }, 2500);
      } catch (erro) {
        console.error(erro);
      }
    }

    function parseCSV(textoCSV) {
      const linhas = textoCSV.trim().split(/\r?\n/);
      if (linhas.length < 2) return [];

      const dividirLinha = (linha) => {
        const resultado = [];
        let atual = '';
        let entreAspas = false;

        for (let i = 0; i < linha.length; i++) {
          const char = linha[i];
          if (char === '"') {
            entreAspas = !entreAspas;
          } else if (char === ',' && !entreAspas) {
            resultado.push(atual.trim());
            atual = '';
          } else {
            atual += char;
          }
        }
        resultado.push(atual.trim());
        return resultado;
      };

      const cabecalhos = dividirLinha(linhas[0]);
      const idxLocal = cabecalhos.findIndex(c => c.toLowerCase().includes('nome do local'));
      const idxLat = cabecalhos.findIndex(c => c.toLowerCase().includes('latitude'));
      const idxLon = cabecalhos.findIndex(c => c.toLowerCase().includes('longitude'));

      if (idxLocal === -1 || idxLat === -1 || idxLon === -1) {
        throw new Error("Colunas 'Nome do local', 'Latitude' ou 'Longitude' não encontradas na planilha.");
      }

      const dados = [];
      for (let i = 1; i < linhas.length; i++) {
        if (!linhas[i].trim()) continue;
        const colunas = dividirLinha(linhas[i]);

        const nome = colunas[idxLocal];
        const lat = parseFloat((colunas[idxLat] || '').replace(',', '.'));
        const lon = parseFloat((colunas[idxLon] || '').replace(',', '.'));

        if (nome && !isNaN(lat) && !isNaN(lon)) {
          dados.push({ nome, lat, lon });
        }
      }
      return dados.reverse();
    }

    async function buscarTemperatura(local) {
      const url = `${ENDPOINT_API}?latitude=${local.lat}&longitude=${local.lon}&current=temperature_2m`;
      const resposta = await fetch(url);
      if (!resposta.ok) throw new Error(`Erro HTTP ${resposta.status}`);
      const json = await resposta.json();
      return {
        ...local,
        temperatura: json.current?.temperature_2m ?? null,
        unidade: json.current_units?.temperature_2m ?? '°C'
      };
    }

    function criarCard(item) {
      const card = document.createElement('article');
      card.className = 'card';

      const tempFormatada = item.temperatura !== null ? item.temperatura.toFixed(1) : '--';
      const corClasse = item.temperatura >= 25 ? 'warm' : 'cool';

      card.innerHTML = `
        <div class="card-header">
          <h2 class="location-name">${item.nome}</h2>
          <span class="coordinates">Lat: ${item.lat.toFixed(4)} | Lon: ${item.lon.toFixed(4)}</span>
        </div>
        <div class="temp-display">
          <span class="temp-value ${corClasse}">${tempFormatada}</span>
          <span class="temp-unit">${item.unidade}</span>
        </div>
      `;
      return card;
    }

    async function carregarDados() {
      const container = document.getElementById('cardsContainer');
      const loader = document.getElementById('loader');
      const statusText = document.getElementById('statusText');
      const errorBox = document.getElementById('errorBox');
      const refreshBtn = document.getElementById('refreshBtn');

      loader.style.display = 'block';
      refreshBtn.disabled = true;
      errorBox.style.display = 'none';
      statusText.textContent = 'Sincronizando planilha...';

      try {
        const urlSemCache = `${ENDPOINT_PLANILHA}&t=${Date.now()}`;
        const resPlanilha = await fetch(urlSemCache);
        if (!resPlanilha.ok) throw new Error("Não foi possível acessar a planilha do Google Sheets.");
        const textoCSV = await resPlanilha.text();

        const locais = parseCSV(textoCSV);
        if (locais.length === 0) {
          throw new Error("Nenhum local válido encontrado na planilha.");
        }

        statusText.textContent = `Consultando clima de ${locais.length} locais...`;

        const resultados = await Promise.all(locais.map(buscarTemperatura));

        container.innerHTML = '';
        resultados.forEach(item => {
          container.appendChild(criarCard(item));
        });

        const agora = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        statusText.textContent = `Atualizado às ${agora}`;
      } catch (erro) {
        console.error(erro);
        errorBox.textContent = `Erro: ${erro.message}`;
        errorBox.style.display = 'block';
        statusText.textContent = 'Falha na atualização';
      } finally {
        loader.style.display = 'none';
        refreshBtn.disabled = false;
      }
    }

    document.addEventListener('DOMContentLoaded', carregarDados);
  </script>
</body>
</html>
